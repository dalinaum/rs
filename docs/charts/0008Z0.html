<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>에스엔시스 (0008Z0)</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .masthead {
      padding: 12px 16px;
      background: #93c7c4;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .masthead .site-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .masthead .site-title:hover { opacity: 0.85; }
    .toolbar {
      padding: 6px 16px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e3eb;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .toolbar h1 {
      font-size: 15px;
      font-weight: 600;
      color: #333333;
    }
    .toolbar a {
      color: #2196f3;
      text-decoration: none;
      font-size: 13px;
    }
    .toolbar a:hover { text-decoration: underline; }
    .chart-label {
      padding: 4px 16px;
      font-size: 11px;
      color: #787b86;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e3eb;
      flex-shrink: 0;
    }
    .chart-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #candle-chart {
      height: calc(60vh - 40px);
    }
    .divider {
      height: 4px;
      background: #e0e3eb;
    }
    #rs-chart-label {
      padding: 4px 16px;
      font-size: 11px;
      color: #787b86;
      background: #f8f9fa;
      border-top: 1px solid #e0e3eb;
    }
    #rs-chart {
      height: calc(40vh - 40px);
    }
    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .legend-dot {
      width: 10px;
      height: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="masthead">
    <a href="../" class="site-title">달리나음의 상대 강도</a>
  </div>
  <div class="toolbar">
    <a href="../">&larr; 목록</a>
    <h1>에스엔시스 (0008Z0)</h1>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#2196f3"></div>MA50</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>MA150</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div>MA200</div>
    </div>
  </div>
  <div class="chart-label">캔들차트 + 이동평균</div>
  <div class="chart-container">
    <div id="candle-chart"></div>
    <div class="divider"></div>
    <div id="rs-chart-label">RS 백분위 추이</div>
    <div id="rs-chart"></div>
  </div>

  <script>
    const candleData = [{"time": "2026-09-01", "open": 24400.0, "high": 24450.0, "low": 23850.0, "close": 24200.0}, {"time": "2026-09-02", "open": 23950.0, "high": 24350.0, "low": 23500.0, "close": 23550.0}, {"time": "2026-09-03", "open": 24050.0, "high": 25500.0, "low": 23750.0, "close": 25050.0}, {"time": "2026-09-04", "open": 25050.0, "high": 25050.0, "low": 24400.0, "close": 24600.0}, {"time": "2026-09-07", "open": 24450.0, "high": 24500.0, "low": 23650.0, "close": 23900.0}, {"time": "2026-09-08", "open": 24400.0, "high": 24400.0, "low": 23400.0, "close": 23400.0}, {"time": "2026-09-09", "open": 23550.0, "high": 24250.0, "low": 23550.0, "close": 23750.0}, {"time": "2026-09-10", "open": 23550.0, "high": 24500.0, "low": 23300.0, "close": 24150.0}, {"time": "2026-09-11", "open": 23950.0, "high": 24450.0, "low": 23500.0, "close": 23800.0}, {"time": "2026-09-14", "open": 23900.0, "high": 24600.0, "low": 23450.0, "close": 24000.0}, {"time": "2026-09-15", "open": 24050.0, "high": 24250.0, "low": 23500.0, "close": 23750.0}, {"time": "2026-09-16", "open": 23750.0, "high": 23950.0, "low": 23200.0, "close": 23400.0}, {"time": "2026-09-17", "open": 23750.0, "high": 24850.0, "low": 23400.0, "close": 24550.0}, {"time": "2026-09-18", "open": 24650.0, "high": 24800.0, "low": 23850.0, "close": 24050.0}, {"time": "2026-09-21", "open": 23950.0, "high": 24000.0, "low": 23300.0, "close": 23800.0}];
    const ma50Data = [{"time": "2026-09-01", "value": 22838.4}, {"time": "2026-09-02", "value": 22757.4}, {"time": "2026-09-03", "value": 22763.4}, {"time": "2026-09-04", "value": 22771.4}, {"time": "2026-09-07", "value": 22773.4}, {"time": "2026-09-08", "value": 22782.4}, {"time": "2026-09-09", "value": 22763.4}, {"time": "2026-09-10", "value": 22773.4}, {"time": "2026-09-11", "value": 22769.4}, {"time": "2026-09-14", "value": 22793.4}, {"time": "2026-09-15", "value": 22783.4}, {"time": "2026-09-16", "value": 22767.4}, {"time": "2026-09-17", "value": 22812.4}, {"time": "2026-09-18", "value": 22882.4}, {"time": "2026-09-21", "value": 22950.4}];
    const ma150Data = [{"time": "2026-09-01", "value": 29473.47}, {"time": "2026-09-02", "value": 29414.8}, {"time": "2026-09-03", "value": 29363.13}, {"time": "2026-09-04", "value": 29300.47}, {"time": "2026-09-07", "value": 29233.8}, {"time": "2026-09-08", "value": 29165.8}, {"time": "2026-09-09", "value": 29104.13}, {"time": "2026-09-10", "value": 29046.13}, {"time": "2026-09-11", "value": 28979.8}, {"time": "2026-09-14", "value": 28927.13}, {"time": "2026-09-15", "value": 28861.47}, {"time": "2026-09-16", "value": 28790.47}, {"time": "2026-09-17", "value": 28736.8}, {"time": "2026-09-18", "value": 28687.13}, {"time": "2026-09-21", "value": 28630.13}];
    const ma200Data = [{"time": "2026-09-01", "value": 30061.1}, {"time": "2026-09-02", "value": 30007.1}, {"time": "2026-09-03", "value": 29959.6}, {"time": "2026-09-04", "value": 29906.35}, {"time": "2026-09-07", "value": 29851.35}, {"time": "2026-09-08", "value": 29794.35}, {"time": "2026-09-09", "value": 29741.85}, {"time": "2026-09-10", "value": 29689.6}, {"time": "2026-09-11", "value": 29644.85}, {"time": "2026-09-14", "value": 29608.1}, {"time": "2026-09-15", "value": 29565.85}, {"time": "2026-09-16", "value": 29530.35}, {"time": "2026-09-17", "value": 29497.1}, {"time": "2026-09-18", "value": 29464.1}, {"time": "2026-09-21", "value": 29425.85}];
    const rsData = [{"time": "2026-09-01", "value": 16}, {"time": "2026-09-02", "value": 21}, {"time": "2026-09-03", "value": 25}, {"time": "2026-09-04", "value": 23}, {"time": "2026-09-07", "value": 23}, {"time": "2026-09-08", "value": 16}, {"time": "2026-09-09", "value": 13}, {"time": "2026-09-10", "value": 15}, {"time": "2026-09-11", "value": 13}, {"time": "2026-09-14", "value": 11}, {"time": "2026-09-15", "value": 11}, {"time": "2026-09-16", "value": 12}, {"time": "2026-09-17", "value": 15}, {"time": "2026-09-18", "value": 11}, {"time": "2026-09-21", "value": 11}];

    const chartOptions = {
      layout: {
        background: { color: '#ffffff' },
        textColor: '#333333',
      },
      grid: {
        vertLines: { color: '#e0e3eb' },
        horzLines: { color: '#e0e3eb' },
      },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#d1d4dc' },
      timeScale: { borderColor: '#d1d4dc', timeVisible: true, fixLeftEdge: true, fixRightEdge: true },
    };

    // 캔들차트
    const candleEl = document.getElementById('candle-chart');
    const candleChart = LightweightCharts.createChart(candleEl, {
      ...chartOptions,
      autoSize: true,
    });

    const candleSeries = candleChart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#ef5350',
      downColor: '#2196f3',
      borderDownColor: '#2196f3',
      borderUpColor: '#ef5350',
      wickDownColor: '#2196f3',
      wickUpColor: '#ef5350',
    });
    candleSeries.setData(candleData);

    const ma50Series = candleChart.addSeries(LightweightCharts.LineSeries, { color: '#2196f3', lineWidth: 1, priceLineVisible: false });
    ma50Series.setData(ma50Data);

    const ma150Series = candleChart.addSeries(LightweightCharts.LineSeries, { color: '#ff9800', lineWidth: 1, priceLineVisible: false });
    ma150Series.setData(ma150Data);

    const ma200Series = candleChart.addSeries(LightweightCharts.LineSeries, { color: '#f44336', lineWidth: 1, priceLineVisible: false });
    ma200Series.setData(ma200Data);

    candleChart.timeScale().fitContent();

    // RS 점수 차트
    const rsEl = document.getElementById('rs-chart');
    const rsChart = LightweightCharts.createChart(rsEl, {
      ...chartOptions,
      autoSize: true,
    });

    const rsSeries = rsChart.addSeries(LightweightCharts.LineSeries, {
      color: '#7b1fa2',
      lineWidth: 2,
      priceLineVisible: false,
    });
    rsSeries.setData(rsData);
    rsChart.timeScale().fitContent();

    // 두 차트 시간축 동기화 (같은 날짜 범위이므로 logical range 사용)
    let syncing = false;
    candleChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (syncing || !range) return;
      syncing = true;
      rsChart.timeScale().setVisibleLogicalRange(range);
      syncing = false;
    });
    rsChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (syncing || !range) return;
      syncing = true;
      candleChart.timeScale().setVisibleLogicalRange(range);
      syncing = false;
    });
  </script>
</body>
</html>
