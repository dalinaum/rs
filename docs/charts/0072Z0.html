<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KB제33호스팩 (0072Z0)</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .masthead {
      padding: 12px 16px;
      background: #93c7c4;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .masthead .site-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .masthead .site-title:hover { opacity: 0.85; }
    .toolbar {
      padding: 6px 16px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e3eb;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .toolbar h1 {
      font-size: 15px;
      font-weight: 600;
      color: #333333;
    }
    .toolbar a {
      color: #2196f3;
      text-decoration: none;
      font-size: 13px;
    }
    .toolbar a:hover { text-decoration: underline; }
    .chart-label {
      padding: 4px 16px;
      font-size: 11px;
      color: #787b86;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e3eb;
      flex-shrink: 0;
    }
    .chart-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #candle-chart {
      height: calc(60vh - 40px);
    }
    .divider {
      height: 4px;
      background: #e0e3eb;
    }
    #rs-chart-label {
      padding: 4px 16px;
      font-size: 11px;
      color: #787b86;
      background: #f8f9fa;
      border-top: 1px solid #e0e3eb;
    }
    #rs-chart {
      height: calc(40vh - 40px);
    }
    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .legend-dot {
      width: 10px;
      height: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="masthead">
    <a href="../" class="site-title">달리나음의 상대 강도</a>
  </div>
  <div class="toolbar">
    <a href="../">&larr; 목록</a>
    <h1>KB제33호스팩 (0072Z0)</h1>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#2196f3"></div>MA50</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>MA150</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div>MA200</div>
    </div>
  </div>
  <div class="chart-label">캔들차트 + 이동평균</div>
  <div class="chart-container">
    <div id="candle-chart"></div>
    <div class="divider"></div>
    <div id="rs-chart-label">RS 백분위 추이</div>
    <div id="rs-chart"></div>
  </div>

  <script>
    const candleData = [{"time": "2026-10-19", "open": 1979.0, "high": 1985.0, "low": 1970.0, "close": 1974.0}, {"time": "2026-10-20", "open": 1961.0, "high": 1984.0, "low": 1961.0, "close": 1984.0}, {"time": "2026-10-21", "open": 1983.0, "high": 1984.0, "low": 1975.0, "close": 1976.0}, {"time": "2026-10-22", "open": 1967.0, "high": 1998.0, "low": 1967.0, "close": 1988.0}, {"time": "2026-10-23", "open": 1986.0, "high": 1986.0, "low": 1975.0, "close": 1985.0}, {"time": "2026-10-26", "open": 1979.0, "high": 1985.0, "low": 1958.0, "close": 1958.0}, {"time": "2026-10-27", "open": 1984.0, "high": 1999.0, "low": 1978.0, "close": 1999.0}, {"time": "2026-10-28", "open": 1988.0, "high": 1988.0, "low": 1970.0, "close": 1973.0}];
    const ma50Data = [{"time": "2026-10-19", "value": 1976.6}, {"time": "2026-10-20", "value": 1976.68}, {"time": "2026-10-21", "value": 1976.5}, {"time": "2026-10-22", "value": 1976.72}, {"time": "2026-10-23", "value": 1976.98}, {"time": "2026-10-26", "value": 1976.52}, {"time": "2026-10-27", "value": 1976.96}, {"time": "2026-10-28", "value": 1976.84}];
    const ma150Data = [{"time": "2026-10-19", "value": 1989.85}, {"time": "2026-10-20", "value": 1989.68}, {"time": "2026-10-21", "value": 1989.49}, {"time": "2026-10-22", "value": 1989.34}, {"time": "2026-10-23", "value": 1989.17}, {"time": "2026-10-26", "value": 1988.86}, {"time": "2026-10-27", "value": 1988.82}, {"time": "2026-10-28", "value": 1988.57}];
    const ma200Data = [{"time": "2026-10-19", "value": 1991.85}, {"time": "2026-10-20", "value": 1991.83}, {"time": "2026-10-21", "value": 1991.77}, {"time": "2026-10-22", "value": 1991.77}, {"time": "2026-10-23", "value": 1991.73}, {"time": "2026-10-26", "value": 1991.57}, {"time": "2026-10-27", "value": 1991.61}, {"time": "2026-10-28", "value": 1991.54}];
    const rsData = [{"time": "2026-10-19", "value": 51}, {"time": "2026-10-20", "value": 59}, {"time": "2026-10-21", "value": 56}, {"time": "2026-10-22", "value": 58}, {"time": "2026-10-23", "value": 59}, {"time": "2026-10-26", "value": 57}, {"time": "2026-10-27", "value": 64}, {"time": "2026-10-28", "value": 59}];

    const chartOptions = {
      layout: {
        background: { color: '#ffffff' },
        textColor: '#333333',
      },
      grid: {
        vertLines: { color: '#e0e3eb' },
        horzLines: { color: '#e0e3eb' },
      },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#d1d4dc' },
      timeScale: { borderColor: '#d1d4dc', timeVisible: true, fixLeftEdge: true, fixRightEdge: true },
    };

    // 캔들차트
    const candleEl = document.getElementById('candle-chart');
    const candleChart = LightweightCharts.createChart(candleEl, {
      ...chartOptions,
      autoSize: true,
    });

    const candleSeries = candleChart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#ef5350',
      downColor: '#2196f3',
      borderDownColor: '#2196f3',
      borderUpColor: '#ef5350',
      wickDownColor: '#2196f3',
      wickUpColor: '#ef5350',
    });
    candleSeries.setData(candleData);

    const ma50Series = candleChart.addSeries(LightweightCharts.LineSeries, { color: '#2196f3', lineWidth: 1, priceLineVisible: false });
    ma50Series.setData(ma50Data);

    const ma150Series = candleChart.addSeries(LightweightCharts.LineSeries, { color: '#ff9800', lineWidth: 1, priceLineVisible: false });
    ma150Series.setData(ma150Data);

    const ma200Series = candleChart.addSeries(LightweightCharts.LineSeries, { color: '#f44336', lineWidth: 1, priceLineVisible: false });
    ma200Series.setData(ma200Data);

    candleChart.timeScale().fitContent();

    // RS 점수 차트
    const rsEl = document.getElementById('rs-chart');
    const rsChart = LightweightCharts.createChart(rsEl, {
      ...chartOptions,
      autoSize: true,
    });

    const rsSeries = rsChart.addSeries(LightweightCharts.LineSeries, {
      color: '#7b1fa2',
      lineWidth: 2,
      priceLineVisible: false,
    });
    rsSeries.setData(rsData);
    rsChart.timeScale().fitContent();

    // 두 차트 시간축 동기화 (같은 날짜 범위이므로 logical range 사용)
    let syncing = false;
    candleChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (syncing || !range) return;
      syncing = true;
      rsChart.timeScale().setVisibleLogicalRange(range);
      syncing = false;
    });
    rsChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (syncing || !range) return;
      syncing = true;
      candleChart.timeScale().setVisibleLogicalRange(range);
      syncing = false;
    });
  </script>
</body>
</html>
