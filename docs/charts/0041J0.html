      font-size: 11px;

      background: #f8f9fa;

    #rs-chart {

    .legend {

      flex-wrap: wrap;
    }
    .legend-item {

      align-items: center;
      gap: 4px;
      font-size: 11px;

    .legend-dot {

      height: 3px;
